<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1b3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>VIP Booking</title>
<style>
:root{--bg:#0b1b3a;--bg2:#10244b;--g:#3ddc97;--gr:#9fb3c8;--tx:#e8eef7}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;background:#0b1b3a}
html,body{min-height:100%}
*{-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overscroll-behavior:none}
button{touch-action:manipulation}
body{background:var(--bg);color:var(--tx);font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;font-weight:400;line-height:1.7;letter-spacing:0;display:flex;justify-content:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{width:100%;max-width:460px;margin:auto;padding:60px 0 28px}
h1{font-size:1.4rem;font-weight:500;line-height:1.6;margin-bottom:8px}
p.sub{color:var(--gr);font-size:.95rem;margin-bottom:24px;line-height:1.8}
.box{background:var(--bg2);border:1px solid var(--g);border-radius:10px;padding:22px;box-shadow:0 0 14px rgba(61,220,151,.22)}
.box.grey{border-color:var(--gr);box-shadow:0 0 12px rgba(159,179,200,.18)}
button,input{font:inherit;color:var(--tx)}
.btn{width:100%;min-height:54px;padding:14px;font-size:1rem;margin-top:12px;background:transparent;border:1px solid var(--g);border-radius:8px;cursor:pointer;box-shadow:0 0 10px rgba(61,220,151,.25);}
.btn:hover,.btn:focus-visible{background:rgba(61,220,151,.12);outline:none}
.btn.alt{border-color:var(--gr);box-shadow:none;color:var(--gr)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input{width:100%;min-height:52px;font-size:16px;padding:13px;margin-top:10px;background:var(--bg);border:1px solid var(--gr);border-radius:8px}
input:focus{outline:none;border-color:var(--g)}
.hide{display:none!important}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--gr);font-size:.9rem}
.nav button{background:none;border:1px solid var(--gr);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--gr)}
.nav button:disabled{opacity:.3}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.day{min-height:68px;padding:9px 0;text-align:center;background:transparent;border:1px solid var(--gr);border-radius:8px;cursor:pointer;font-size:.85rem;line-height:1.7}
.day b{display:block;font-size:1rem;font-weight:600}
.day.sel{border-color:var(--g);box-shadow:0 0 10px rgba(61,220,151,.4);background:rgba(61,220,151,.1)}
.day:disabled{opacity:.28;cursor:not-allowed}
.slots{min-height:252px;align-content:start;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{min-height:54px;padding:12px;font-size:.95rem;background:transparent;border:1px solid var(--gr);border-radius:8px;cursor:pointer}
.slot:hover:not(:disabled){border-color:var(--g)}
.slot:disabled{opacity:.28;cursor:not-allowed}
.sum{border-inline-start:3px solid var(--g);padding:4px 14px;margin:6px 0 10px;line-height:2}
#lang .btn{margin-top:10px}
.mini{position:fixed;top:calc(env(safe-area-inset-top) + 10px);z-index:5;min-height:36px;inset-inline-end:12px;background:none;border:1px solid var(--gr);color:var(--gr);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.8rem}
.ico{width:46px;height:46px;color:var(--g);margin-bottom:12px;filter:drop-shadow(0 0 6px rgba(61,220,151,.55))}
.ico svg,.btn svg,.slot svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ico svg{width:100%;height:100%}
.btn{display:flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:20px;height:20px;flex:none}
.slot{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--tx)}
.slot svg{width:16px;height:16px;color:var(--g);flex:none}
#lang .ico{color:var(--gr);filter:none}
@media(max-width:400px){.box{padding:16px}.days{gap:4px}.slots{gap:6px}.slot{padding:10px 6px;font-size:.88rem}h1{font-size:1.25rem}}
@media(max-height:560px){main{padding-top:48px}.ico{width:36px;height:36px}}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
</style>
</head>
<body>
<button class="mini hide" id="mini">EN</button>
<main>
 <section id="lang" class="box grey">
  <div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></div><h1>زبان خود را انتخاب کنید<br><span style="color:var(--gr);font-weight:400;font-size:1rem">Choose your language</span></h1>
  <button class="btn" data-l="fa">فارسی</button>
  <button class="btn" data-l="en">English</button>
 </section>

 <section id="s1" class="hide box">
  <div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.5"/></svg></div><h1 data-t="t1"></h1><p class="sub" data-t="d1"></p>
  <button class="btn" id="go1" data-t="b1"></button>
 </section>

 <section id="s2" class="hide box">
  <div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div><h1 data-t="t2"></h1><p class="sub" data-t="d2"></p>
  <input id="fn" autocomplete="given-name" enterkeyhint="next"><input id="ln" autocomplete="family-name" enterkeyhint="done">
  <button class="btn" id="go2" disabled data-t="b2"></button>
 </section>

 <section id="s3" class="hide">
  <div class="box">
   <div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><h1 data-t="t3"></h1>
   <div class="nav"><button id="prev"></button><span id="range"></span><button id="next"></button></div>
   <div class="days" id="days"></div>
   <div class="slots" id="slots"></div>
  </div>
 </section>

 <section id="s4" class="hide box">
  <div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg></div><h1 data-t="t4"></h1>
  <div class="sum" id="sum"></div>
  <p class="sub" data-t="d4"></p>
  <button class="btn" id="wa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.4 18.7L4 20z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5"/></svg><span></span></button>
  <button class="btn" id="sms"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M7 10h10M7 14h6M8 21l3-3"/></svg><span></span></button>
  <button class="btn alt" id="back" data-t="b4"></button>
 </section>
</main>

<script>
const CLK='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const PHONE="989124525214"; // 09124525214
const LOG_URL="https://script.google.com/macros/s/AKfycbw_CAChfudJ6Q0r-ovXxeLsM2f_03jip5DbwVdwgL1w37TBhmir4OZEkYTpoVMhmj55XA/exec";
function logBooking(ch){
 if(!LOG_URL.startsWith("https://"))return;
 try{fetch(LOG_URL,{method:"POST",mode:"no-cors",keepalive:true,
  body:JSON.stringify({name:($("fn").value+" "+$("ln").value).trim(),date:fmt(pick),time:hh(hr)+" – "+hh(hr+1),channel:ch,lang:L})})}catch(e){}
}
const T={
fa:{t1:"رزرو وقت ویزیت",d1:"برای تعیین وقت ملاقات، دکمه زیر را بزنید.",b1:"برای تعیین وقت کلیک کنید",
t2:"مشخصات شما",d2:"لطفاً نام و نام خانوادگی خود را وارد کنید.",fn:"نام",ln:"نام خانوادگی",b2:"تأیید",
t3:"انتخاب روز و ساعت",prev:"هفته قبل",next:"هفته بعد",
t4:"وقت شما انتخاب شد",d4:"برای نهایی شدن، پیام را برای شماره‌ی ما ارسال کنید.",b4:"تغییر زمان",wa:"ارسال از طریق واتس‌اپ",sms:"ارسال پیامک",
msg:(n,d,h)=>`سلام، من ${n} هستم.\nقرار ویزیت: ${d}، ساعت ${h}\nلطفاً تأیید بفرمایید.`,
wd:["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"],
mo:["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"],
num:s=>String(s).replace(/\d/g,x=>"۰۱۲۳۴۵۶۷۸۹"[x])},
en:{t1:"Book a Visit",d1:"Tap the button below to choose an appointment time.",b1:"Click to choose a time",
t2:"Your details",d2:"Please enter your first and last name.",fn:"First name",ln:"Last name",b2:"Confirm",
t3:"Choose a day and time",prev:"Previous week",next:"Next week",
t4:"Your time is selected",d4:"Send the message to our number to finalize.",b4:"Change time",wa:"Send via WhatsApp",sms:"Send via SMS",
msg:(n,d,h)=>`Hello, I am ${n}.\nVisit appointment: ${d}, at ${h}\nPlease confirm.`,
wd:["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday","Friday"],
mo:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
num:s=>String(s)}};
const $=id=>document.getElementById(id);
let L="fa",wk=0,pick=null,hr=null,cur="lang";
const SD=i=>L==="fa"?"شیدسچپج"[i]:T.en.wd[i].slice(0,3);
const show=id=>{window.scrollTo(0,0);["lang","s1","s2","s3","s4"].forEach(x=>$(x).classList.toggle("hide",x!==id));cur=id;$("mini").classList.toggle("hide",id==="lang")};
const jp=d=>{const p=new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn",{year:"numeric",month:"numeric",day:"numeric"}).formatToParts(d);const g=t=>+p.find(x=>x.type===t).value;return{y:g("year"),m:g("month"),d:g("day")}};
const FA_M=T.fa.mo;
function weekStart(){const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()-((t.getDay()+1)%7)+7*wk);return t}
function fmt(d){ // L-aware date label
 const t=T[L],i=(d.getDay()+1)%7;
 if(L==="fa"){const j=jp(d);return `${t.wd[i]} ${t.num(j.d)} ${FA_M[j.m-1]} ${t.num(j.y)}`}
 return `${t.wd[i]} ${d.getDate()} ${t.mo[d.getMonth()]} ${d.getFullYear()}`}
function short(d){const t=T[L];if(L==="fa"){const j=jp(d);return t.num(j.d)+" "+FA_M[j.m-1]}return d.getDate()+" "+t.mo[d.getMonth()]}
const hh=h=>T[L].num(String(h).padStart(2,"0")+":00");
function applyLang(){
 const t=T[L];document.documentElement.lang=L;document.documentElement.dir=L==="fa"?"rtl":"ltr";
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
 $("fn").placeholder=t.fn;$("ln").placeholder=t.ln;
 $("prev").textContent=t.prev;$("next").textContent=t.next;$("wa").lastElementChild.textContent=t.wa;$("sms").lastElementChild.textContent=t.sms;
 $("mini").textContent=L==="fa"?"EN":"فا";
 if(cur==="s3")drawWeek();if(cur==="s4")summary()}
function drawWeek(){
 const s=weekStart(),now=new Date(),today=new Date();today.setHours(0,0,0,0);
 const e=new Date(s);e.setDate(e.getDate()+6);
 $("range").textContent=short(s)+" – "+short(e);
 $("prev").disabled=wk===0;$("next").disabled=wk===1;
 const box=$("days");box.innerHTML="";
 for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);
  const b=document.createElement("button");b.className="day";
  const num=L==="fa"?T.fa.num(jp(d).d):d.getDate();
  b.innerHTML=`${SD(i)}<b>${num}</b>`;b.setAttribute("aria-label",T[L].wd[i]);
  b.disabled=d<today;
  if(pick&&pick.getTime()===d.getTime())b.classList.add("sel");
  b.onclick=()=>{pick=d;document.querySelectorAll(".day").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");drawSlots()};box.appendChild(b)}
 drawSlots()}
function drawSlots(){
 const now=new Date(),today=new Date();today.setHours(0,0,0,0);
 const sl=$("slots");sl.innerHTML="";
 if(!pick)return;
 for(let h=10;h<18;h++){const b=document.createElement("button");b.className="slot";
  b.innerHTML=CLK+`<span>${hh(h)} – ${hh(h+1)}</span>`;
  const same=pick.getTime()===today.getTime();
  b.disabled=same&&h<=now.getHours();
  b.onclick=()=>{hr=h;summary();show("s4")};sl.appendChild(b)}}
function msg(){const n=($("fn").value+" "+$("ln").value).trim();return T[L].msg(n,fmt(pick),`${hh(hr)} – ${hh(hr+1)}`)}
function summary(){if(!pick||hr==null)return;$("sum").innerHTML=msg().split("\n").slice(1,2).join("")}
$("wa").onclick=()=>{logBooking("whatsapp");window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(msg())}`,"_blank")};
$("sms").onclick=()=>{logBooking("sms");location.href=`sms:+${PHONE}?&body=${encodeURIComponent(msg())}`};
document.querySelectorAll("#lang [data-l]").forEach(b=>b.onclick=()=>{L=b.dataset.l;applyLang();show("s1")});
$("mini").onclick=()=>{L=L==="fa"?"en":"fa";applyLang()};
$("go1").onclick=()=>show("s2");
const chk=()=>$("go2").disabled=!($("fn").value.trim()&&$("ln").value.trim());
$("fn").oninput=$("ln").oninput=chk;
$("go2").onclick=()=>{wk=0;pick=null;hr=null;show("s3");drawWeek()};
$("prev").onclick=()=>{wk=0;pick=null;drawWeek()};
$("next").onclick=()=>{wk=1;pick=null;drawWeek()};
$("back").onclick=()=>{hr=null;show("s3");drawWeek()};
applyLang();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
